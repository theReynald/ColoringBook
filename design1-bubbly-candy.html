<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorSplash — Bubbly Candy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #FF6B9D;
    --lavender: #C084FC;
    --mint: #6EE7B7;
    --peach: #FBBF24;
    --baby-blue: #7DD3FC;
    --pink-light: #FFF0F5;
    --lavender-light: #F5F0FF;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.7);
    --radius: 24px;
    --radius-lg: 32px;
  }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #FFF0F5 0%, #F3E8FF 50%, #EFF6FF 100%);
    overflow-x: hidden;
    color: #4A3060;
    position: relative;
  }

  /* ── Animated background bubbles ── */
  .bubbles-container {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bubble {
    position: absolute; border-radius: 50%;
    opacity: 0.18; animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.18; }
    50%  { opacity: 0.25; }
    100% { transform: translateY(-110vh) scale(1.15); opacity: 0; }
  }

  /* ── Decorative shapes ── */
  .deco { position: fixed; pointer-events: none; z-index: 0; opacity: 0.35; }
  .deco-star {
    width: 18px; height: 18px;
    background: var(--peach);
    clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  .deco-heart {
    width: 16px; height: 16px;
    background: var(--pink);
    clip-path: polygon(50% 85%,15% 45%,0% 25%,5% 5%,25% 0%,50% 20%,75% 0%,95% 5%,100% 25%,85% 45%);
    animation: twinkle 4s ease-in-out infinite alternate-reverse;
  }
  .deco-circle {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--mint);
    animation: twinkle 2.5s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { transform: scale(1) rotate(0deg); opacity: 0.3; }
    100% { transform: scale(1.3) rotate(20deg); opacity: 0.55; }
  }

  /* ── Layout ── */
  .app-wrapper {
    position: relative; z-index: 1;
    max-width: 780px; margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ── Header ── */
  .header {
    text-align: center; margin-bottom: 28px;
  }
  .logo {
    font-size: 3rem; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--pink), var(--lavender), var(--baby-blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: logoShimmer 6s ease-in-out infinite alternate;
    display: inline-block;
  }
  @keyframes logoShimmer {
    0%   { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(30deg); }
  }
  .logo .splash { color: var(--peach); -webkit-text-fill-color: var(--peach); }
  .tagline {
    font-size: 1.05rem; font-weight: 600; color: #9B8AB8; margin-top: 4px;
  }

  /* ── Glass Card ── */
  .card {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius-lg);
    padding: 28px 28px 32px;
    margin-bottom: 22px;
    box-shadow: 0 8px 32px rgba(192,132,252,0.10), 0 1.5px 6px rgba(0,0,0,0.04);
    transition: box-shadow 0.3s;
  }
  .card:hover { box-shadow: 0 12px 40px rgba(192,132,252,0.16), 0 2px 8px rgba(0,0,0,0.05); }

  .card-title {
    font-size: 1.15rem; font-weight: 800; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  /* ── Settings toggle ── */
  .settings-toggle {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
    font-size: 0.95rem; font-weight: 700; color: #9B8AB8;
    background: none; border: none; font-family: inherit;
    padding: 8px 16px; border-radius: 50px;
    transition: background 0.2s, color 0.2s;
  }
  .settings-toggle:hover { background: rgba(192,132,252,0.10); color: var(--lavender); }
  .settings-toggle .chevron {
    display: inline-block; transition: transform 0.3s;
    font-size: 0.75rem;
  }
  .settings-toggle.open .chevron { transform: rotate(180deg); }

  .settings-body {
    max-height: 0; overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
    opacity: 0;
  }
  .settings-body.open { max-height: 200px; opacity: 1; }

  /* ── Inputs ── */
  .input-group { margin-top: 12px; }
  .input-group label {
    display: block; font-weight: 700; font-size: 0.9rem;
    margin-bottom: 6px; color: #7C6A96;
  }
  .text-input {
    width: 100%; padding: 12px 16px;
    border: 2px solid rgba(192,132,252,0.25);
    border-radius: 16px; font-family: inherit; font-size: 0.95rem;
    background: rgba(255,255,255,0.7);
    color: #4A3060; outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .text-input::placeholder { color: #C4B5D4; }
  .text-input:focus {
    border-color: var(--lavender);
    box-shadow: 0 0 0 4px rgba(192,132,252,0.13);
  }

  /* ── Upload area ── */
  .upload-zone {
    border: 3px dashed rgba(192,132,252,0.35);
    border-radius: var(--radius-lg);
    padding: 44px 24px;
    text-align: center; cursor: pointer;
    transition: border-color 0.25s, background 0.25s, transform 0.2s;
    background: rgba(255,255,255,0.35);
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--lavender);
    background: rgba(192,132,252,0.07);
    transform: scale(1.01);
  }
  .upload-zone.drag-over { border-style: solid; }
  .upload-icon {
    font-size: 3rem; margin-bottom: 8px; display: block;
    animation: gentleBounce 2.5s ease-in-out infinite;
  }
  @keyframes gentleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .upload-text { font-weight: 700; font-size: 1.05rem; color: #7C6A96; }
  .upload-hint { font-size: 0.85rem; color: #B8A5CC; margin-top: 4px; }
  .upload-zone input[type="file"] { display: none; }

  /* ── Image preview ── */
  .preview-wrapper {
    margin-top: 18px; display: none;
    position: relative; text-align: center;
  }
  .preview-wrapper.visible { display: block; }
  .preview-img {
    max-width: 100%; max-height: 340px;
    border-radius: var(--radius); object-fit: contain;
    box-shadow: 0 6px 24px rgba(192,132,252,0.13);
  }
  .remove-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(255,107,157,0.85); color: #fff;
    border: none; border-radius: 50%; width: 32px; height: 32px;
    font-size: 1.1rem; cursor: pointer; font-family: inherit; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, background 0.2s;
  }
  .remove-btn:hover { transform: scale(1.15); background: var(--pink); }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 32px; border: none; border-radius: 50px;
    font-family: inherit; font-size: 1rem; font-weight: 800;
    cursor: pointer; color: #fff; position: relative;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    text-decoration: none;
  }
  .btn:hover { transform: scale(1.05); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    box-shadow: 0 6px 20px rgba(255,107,157,0.25);
  }
  .btn-primary:hover { box-shadow: 0 8px 28px rgba(255,107,157,0.35); }

  .btn-mint {
    background: linear-gradient(135deg, var(--mint), var(--baby-blue));
    box-shadow: 0 6px 20px rgba(110,231,183,0.25);
    color: #1E5048;
  }
  .btn-mint:hover { box-shadow: 0 8px 28px rgba(110,231,183,0.35); }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }

  /* ── Result ── */
  .result-section { display: none; }
  .result-section.visible { display: block; }
  .result-img {
    width: 100%; border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(192,132,252,0.13);
  }

  /* ── Loader ── */
  .loader-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(255,240,245,0.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    flex-direction: column; align-items: center; justify-content: center;
  }
  .loader-overlay.visible { display: flex; }
  .loader-bubbles { display: flex; gap: 14px; margin-bottom: 24px; }
  .loader-bubbles span {
    width: 22px; height: 22px; border-radius: 50%;
    animation: loaderBounce 1.4s ease-in-out infinite;
  }
  .loader-bubbles span:nth-child(1) { background: var(--pink); animation-delay: 0s; }
  .loader-bubbles span:nth-child(2) { background: var(--lavender); animation-delay: 0.15s; }
  .loader-bubbles span:nth-child(3) { background: var(--mint); animation-delay: 0.3s; }
  .loader-bubbles span:nth-child(4) { background: var(--peach); animation-delay: 0.45s; }
  .loader-bubbles span:nth-child(5) { background: var(--baby-blue); animation-delay: 0.6s; }
  @keyframes loaderBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.2); opacity: 1; }
  }
  .loader-text { font-weight: 800; font-size: 1.15rem; color: #7C6A96; }

  /* ── Error toast ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, #FF6B9D, #E05480);
    color: #fff; padding: 14px 28px; border-radius: 50px;
    font-weight: 700; font-size: 0.95rem; z-index: 200;
    box-shadow: 0 8px 28px rgba(255,107,157,0.35);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 90%; text-align: center;
  }
  .toast.visible { transform: translateX(-50%) translateY(0); }

  /* ── Rainbow divider ── */
  .rainbow-divider {
    height: 4px; border-radius: 4px; margin: 10px 0 18px;
    background: linear-gradient(90deg, var(--pink), var(--peach), var(--mint), var(--baby-blue), var(--lavender));
    opacity: 0.45;
  }

  /* ── Responsive ── */
  @media (max-width: 540px) {
    .app-wrapper { padding: 20px 10px 40px; }
    .card { padding: 20px 16px 24px; border-radius: var(--radius); }
    .logo { font-size: 2.2rem; }
    .upload-zone { padding: 32px 16px; }
    .btn { padding: 12px 22px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<!-- Background Bubbles -->
<div class="bubbles-container" id="bubblesContainer"></div>

<!-- Decorative elements -->
<div class="deco deco-star" style="top:8%;left:6%;"></div>
<div class="deco deco-heart" style="top:14%;right:9%;animation-delay:1s;"></div>
<div class="deco deco-circle" style="top:30%;left:3%;animation-delay:0.5s;background:var(--baby-blue);"></div>
<div class="deco deco-star" style="top:52%;right:5%;animation-delay:1.5s;background:var(--mint);"></div>
<div class="deco deco-heart" style="top:70%;left:7%;animation-delay:0.8s;background:var(--lavender);"></div>
<div class="deco deco-circle" style="top:85%;right:8%;animation-delay:2s;background:var(--peach);"></div>
<div class="deco deco-star" style="top:42%;left:92%;animation-delay:0.3s;background:var(--pink);"></div>
<div class="deco deco-heart" style="top:60%;right:93%;animation-delay:1.8s;"></div>
<div class="deco deco-circle" style="top:20%;left:94%;animation-delay:1.2s;"></div>
<div class="deco deco-star" style="top:92%;left:50%;animation-delay:2.2s;background:var(--baby-blue);"></div>

<!-- App -->
<div class="app-wrapper">

  <!-- Header -->
  <header class="header">
    <h1 class="logo">Color<span class="splash">Splash</span> 🎨</h1>
    <p class="tagline">Turn any photo into a magical coloring page ✨</p>
  </header>

  <!-- Settings Card -->
  <div class="card">
    <button class="settings-toggle" id="settingsToggle" aria-expanded="false">
      ⚙️ <span>Settings</span>
      <span class="chevron">▼</span>
    </button>
    <div class="settings-body" id="settingsBody">
      <div class="rainbow-divider"></div>
      <div class="input-group">
        <label for="apiKeyInput">🔑 OpenAI API Key</label>
        <input type="password" id="apiKeyInput" class="text-input" placeholder="sk-..." autocomplete="off">
      </div>
    </div>
  </div>

  <!-- Upload Card -->
  <div class="card">
    <div class="card-title">📸 Upload Your Photo</div>
    <div class="rainbow-divider"></div>

    <div class="upload-zone" id="uploadZone">
      <span class="upload-icon">☁️</span>
      <div class="upload-text">Drop your photo here</div>
      <div class="upload-hint">or click to browse · JPG, PNG, WEBP</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
    </div>

    <div class="preview-wrapper" id="previewWrapper">
      <button class="remove-btn" id="removeBtn" title="Remove image">✕</button>
      <img class="preview-img" id="previewImg" alt="Uploaded preview">
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="convertBtn" disabled>
        🪄 Convert to Coloring Page
      </button>
    </div>
  </div>

  <!-- Result Card -->
  <div class="card result-section" id="resultSection">
    <div class="card-title">🖍️ Your Coloring Page</div>
    <div class="rainbow-divider"></div>
    <img class="result-img" id="resultImg" alt="Coloring page result">
    <div class="actions">
      <button class="btn btn-mint" id="downloadBtn">💾 Download</button>
      <button class="btn btn-primary" id="newBtn">🔄 New Image</button>
    </div>
  </div>

</div>

<!-- Loader -->
<div class="loader-overlay" id="loader">
  <div class="loader-bubbles">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="loader-text">Creating your coloring page…</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(() => {
  // ── Refs ──
  const settingsToggle  = document.getElementById('settingsToggle');
  const settingsBody    = document.getElementById('settingsBody');
  const apiKeyInput     = document.getElementById('apiKeyInput');
  const uploadZone      = document.getElementById('uploadZone');
  const fileInput       = document.getElementById('fileInput');
  const previewWrapper  = document.getElementById('previewWrapper');
  const previewImg      = document.getElementById('previewImg');
  const removeBtn       = document.getElementById('removeBtn');
  const convertBtn      = document.getElementById('convertBtn');
  const resultSection   = document.getElementById('resultSection');
  const resultImg       = document.getElementById('resultImg');
  const downloadBtn     = document.getElementById('downloadBtn');
  const newBtn          = document.getElementById('newBtn');
  const loader          = document.getElementById('loader');
  const toast           = document.getElementById('toast');

  let uploadedBase64 = null;
  let resultDataUrl  = null;

  // ── Bubbles background ──
  function createBubbles() {
    const container = document.getElementById('bubblesContainer');
    const colors = ['#FF6B9D','#C084FC','#6EE7B7','#FBBF24','#7DD3FC'];
    for (let i = 0; i < 18; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 20 + Math.random() * 60;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.bottom = -size + 'px';
      b.style.background = colors[Math.floor(Math.random() * colors.length)];
      b.style.animationDuration = (12 + Math.random() * 18) + 's';
      b.style.animationDelay = (Math.random() * 15) + 's';
      container.appendChild(b);
    }
  }
  createBubbles();

  // ── Restore API key ──
  const savedKey = localStorage.getItem('colorsplash_api_key');
  if (savedKey) apiKeyInput.value = savedKey;

  apiKeyInput.addEventListener('input', () => {
    localStorage.setItem('colorsplash_api_key', apiKeyInput.value.trim());
  });

  // ── Settings toggle ──
  settingsToggle.addEventListener('click', () => {
    const open = settingsBody.classList.toggle('open');
    settingsToggle.classList.toggle('open', open);
    settingsToggle.setAttribute('aria-expanded', open);
  });

  // If no key saved, auto-open settings
  if (!savedKey) {
    settingsBody.classList.add('open');
    settingsToggle.classList.add('open');
    settingsToggle.setAttribute('aria-expanded', 'true');
  }

  // ── Upload zone ──
  uploadZone.addEventListener('click', () => fileInput.click());

  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    if (!file.type.match(/^image\/(jpeg|png|webp)$/)) {
      showToast('Please upload a JPG, PNG, or WEBP image.');
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      showToast('Image must be under 20 MB.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      uploadedBase64 = e.target.result;
      previewImg.src = uploadedBase64;
      previewWrapper.classList.add('visible');
      uploadZone.style.display = 'none';
      convertBtn.disabled = false;
      resultSection.classList.remove('visible');
      resultDataUrl = null;
    };
    reader.readAsDataURL(file);
  }

  removeBtn.addEventListener('click', resetUpload);

  function resetUpload() {
    uploadedBase64 = null;
    resultDataUrl = null;
    fileInput.value = '';
    previewWrapper.classList.remove('visible');
    uploadZone.style.display = '';
    convertBtn.disabled = true;
    resultSection.classList.remove('visible');
  }

  // ── Convert ──
  convertBtn.addEventListener('click', convert);

  async function convert() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) {
      showToast('Please enter your OpenAI API key in Settings.');
      settingsBody.classList.add('open');
      settingsToggle.classList.add('open');
      return;
    }
    if (!uploadedBase64) {
      showToast('Please upload an image first.');
      return;
    }

    loader.classList.add('visible');
    convertBtn.disabled = true;

    try {
      // Extract raw base64 (strip data URI prefix)
      const base64Data = uploadedBase64.split(',')[1];

      const response = await fetch('https://api.openai.com/v1/images/edits', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'gpt-image-1',
          image: base64Data,
          prompt: 'Convert this photo into a black and white coloring book page with clean outlines, no shading, suitable for children to color in',
          n: 1,
          size: '1024x1024'
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error ${response.status}`);
      }

      const data = await response.json();

      // Handle both b64_json and url responses
      if (data.data?.[0]?.b64_json) {
        resultDataUrl = `data:image/png;base64,${data.data[0].b64_json}`;
      } else if (data.data?.[0]?.url) {
        resultDataUrl = data.data[0].url;
      } else {
        throw new Error('Unexpected API response format.');
      }

      resultImg.src = resultDataUrl;
      resultSection.classList.add('visible');
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      showToast(err.message || 'Something went wrong. Please try again.');
    } finally {
      loader.classList.remove('visible');
      convertBtn.disabled = false;
    }
  }

  // ── Download ──
  downloadBtn.addEventListener('click', async () => {
    if (!resultDataUrl) return;
    try {
      let blobUrl = resultDataUrl;

      // If it's a remote URL, fetch it as a blob
      if (resultDataUrl.startsWith('http')) {
        const resp = await fetch(resultDataUrl);
        const blob = await resp.blob();
        blobUrl = URL.createObjectURL(blob);
      }

      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = 'colorsplash-coloring-page.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      if (blobUrl !== resultDataUrl) URL.revokeObjectURL(blobUrl);
    } catch {
      showToast('Could not download. Try right-clicking the image and saving.');
    }
  });

  // ── New image ──
  newBtn.addEventListener('click', resetUpload);

  // ── Toast ──
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('visible'), 4500);
  }
})();
</script>
</body>
</html>
